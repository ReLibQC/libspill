# SPDX-License-Identifier: BSD-3-Clause
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  # The development driver: C core, C++ layer, Fortran and Python bindings, the
  # four port shims, packaging, and repository hygiene.
  make:
    name: make check (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran libhdf5-dev python3-numpy cmake
      - name: Build and test
        env:
          CC: ${{ matrix.cc }}
        run: make check

  # The packaged build a consumer would use, including find_package from an
  # out-of-tree project in C, C++ and Fortran.
  cmake:
    name: cmake + ctest + install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran libhdf5-dev cmake
      - name: Configure
        run: |
          cmake -S . -B build \
                -DLIBSPILL_BUILD_FORTRAN=ON \
                -DLIBSPILL_BUILD_TESTS=ON \
                -DLIBSPILL_WITH_HDF5=ON \
                -DLIBSPILL_WITH_CRAYIO=ON \
                -DCMAKE_INSTALL_PREFIX=$PWD/prefix
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install and consume
        run: |
          cmake --install build
          # Absolute: CMake resolves a relative *_DIR against the build
          # directory, not the working directory, so `prefix/...` would be
          # looked for under consumer/ and not found.
          cmake -S tests/consumer -B consumer \
                -Dlibspill_DIR="$(dirname "$(find "$PWD/prefix" -name libspillConfig.cmake)")"
          cmake --build consumer -j
          export LD_LIBRARY_PATH="$(dirname "$(find "$PWD/prefix" -name 'libspill.so.0.*')")"
          ./consumer/c_use && ./consumer/cxx_use && ./consumer/f_use

  # Windows. Psi4 and OpenMolcas both ship Windows builds, so this is not a
  # courtesy target: an adopter replacing its own I/O layer cannot carry a
  # dependency that drops a platform it already supports. MSVC and clang-cl
  # both, because clang-cl is what Psi4's Windows CI actually uses and the two
  # disagree often enough to be worth separating.
  windows:
    name: windows (${{ matrix.toolset }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolset: msvc
            flags: ""
          - toolset: clang-cl
            flags: "-T ClangCL"
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build ${{ matrix.flags }}
          -DLIBSPILL_BUILD_TESTS=ON
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/prefix
      - name: Build
        run: cmake --build build --config Release -j
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install and consume
        shell: bash
        run: |
          cmake --install build --config Release
          cmake -S tests/consumer -B consumer \
                -Dlibspill_DIR="$(dirname "$(find "$PWD/prefix" -name libspillConfig.cmake)")"
          cmake --build consumer --config Release -j

  # The Windows code path, run on Linux. Windows has no mmap, so LS_MAPPED is
  # refused there and ls_map/ls_unmap take a different branch; LS_NO_MMAP
  # compiles and runs exactly those branches here, where the whole suite can
  # exercise them, instead of leaving them to be discovered on Windows.
  no-mmap:
    name: no mapping (the Windows path, on Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y cmake
      - name: Configure, build and test
        run: |
          cmake -S . -B build -DLIBSPILL_BUILD_TESTS=ON -DCMAKE_C_FLAGS=-DLS_NO_MMAP
          cmake --build build -j
          ctest --test-dir build --output-on-failure

  # The suite must also pass with every optional piece absent -- that is what a
  # code taking only the POSIX core would build.
  minimal:
    name: no HDF5, no Fortran, no numpy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y cmake
      - name: Build and test the C core only
        run: make check-c
